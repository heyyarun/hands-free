<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DGSBEKKXMC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DGSBEKKXMC');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hands Free: control a website with hand gestures (webcam + T-Rex game)</title>
    <meta
      name="description"
      content="Scroll and zoom a web page with hand gestures over your webcam, then play the T-Rex game by pinching and making a fist. Open source; all computer vision runs in your browser and no video leaves your machine."
    />
    <link rel="canonical" href="https://www.handfree.live/" />

    <!-- Link previews (X, LinkedIn, Slack, iMessage). og:image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hands Free" />
    <meta property="og:url" content="https://www.handfree.live/" />
    <meta property="og:title" content="Hands Free: a website you never touch" />
    <meta
      property="og:description"
      content="Scroll, zoom and play T-Rex with your bare hands, through your webcam. Open source, runs entirely in your browser."
    />
    <meta property="og:image" content="https://www.handfree.live/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hands Free demo page: 'A page that listens to your hands.' with the gesture control panel" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hands Free: a website you never touch" />
    <meta
      name="twitter:description"
      content="Scroll, zoom and play T-Rex with your bare hands, through your webcam. Open source, runs entirely in your browser."
    />
    <meta name="twitter:image" content="https://www.handfree.live/og.png" />
    <meta name="twitter:image:alt" content="Hands Free demo page: 'A page that listens to your hands.' with the gesture control panel" />
    <meta name="theme-color" content="#05060a" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint: the page renders in system fonts and swaps
         (display=swap) once these arrive. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- The small-screen landing's screenshot is its largest element; fetch it alongside the
         JS instead of after it. Desktop never loads it. -->
    <link rel="preload" as="image" href="/landing-shot.webp" type="image/webp" media="(max-width: 1023px)" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
